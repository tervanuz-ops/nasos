<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<style>
/* Layout: two working columns — inputs left, live engineering results right (sticky on desktop) */
:root{
  --bg:#4677bd; --bg-deep:#3a6ab3; --bg-lite:#7ea2d6; --on-bg:#ffffff; --on-bg-muted:rgba(255,255,255,.78);
  --surface:#ffffff; --field:#f5f8fc; --ink:#14223a; --muted:#5b6880; --line:#d8e0ec;
  --accent:#2c5fae; --accent-ink:#ffffff; --accent-soft:#e3ecf9; --heat:#c9582a; --heat-soft:#f8e3d8;
  --ok:#24804a; --ok-soft:#dcf1e3; --warn:#a86b12; --warn-soft:#f7ecd6; --bad:#b0352c; --bad-soft:#f7dedb;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1c3866; --bg-deep:#152c54; --bg-lite:#2c4e86; --on-bg:#ffffff; --on-bg-muted:rgba(255,255,255,.72);
  --surface:#121c2e; --field:#0e1726; --ink:#e3eaf5; --muted:#93a3bd; --line:#27354d;
  --accent:#86adeb; --accent-ink:#0d1a30; --accent-soft:#1c2d4a; --heat:#ee8a56; --heat-soft:#3a2419;
  --ok:#5cc47e; --ok-soft:#173523; --warn:#e1aa4c; --warn-soft:#3a2c14; --bad:#ef6d61; --bad-soft:#3d1c19; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1c3866; --bg-deep:#152c54; --bg-lite:#2c4e86; --on-bg:#ffffff; --on-bg-muted:rgba(255,255,255,.72);
  --surface:#121c2e; --field:#0e1726; --ink:#e3eaf5; --muted:#93a3bd; --line:#27354d;
  --accent:#86adeb; --accent-ink:#0d1a30; --accent-soft:#1c2d4a; --heat:#ee8a56; --heat-soft:#3a2419;
  --ok:#5cc47e; --ok-soft:#173523; --warn:#e1aa4c; --warn-soft:#3a2c14; --bad:#ef6d61; --bad-soft:#3d1c19; color-scheme:dark }
*{box-sizing:border-box}
html{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;min-height:100vh;background-color:var(--bg);background-attachment:fixed;background-image:
  radial-gradient(circle at 104% -6%, var(--bg-deep) 0 21%, transparent 21.4%),
  radial-gradient(circle at 118% 62%, color-mix(in srgb,var(--bg-lite) 55%,transparent) 0 43%, transparent 43.4%),
  radial-gradient(circle at -22% 38%, color-mix(in srgb,var(--bg-lite) 60%,transparent) 0 46%, transparent 46.4%),
  radial-gradient(ellipse 70% 60% at 50% 48%, var(--bg-deep) 0%, transparent 100%)}
.top{background:transparent;color:var(--on-bg);padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:1500px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:12px;align-items:center}
.brand h1{font-family:var(--f-display);font-weight:600;font-size:19px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.brand p{margin:0;color:var(--on-bg-muted);font-size:12.5px}
.brand img{height:40px;width:auto;display:block}
.brand .div{width:1px;align-self:stretch;background:rgba(255,255,255,.35)}
.top .btn{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.4)}
.top .btn.pri{background:#fff;color:#24529c;border-color:#fff}
.on-bg{color:var(--on-bg-muted)!important}
.top-act{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;border-radius:8px;padding:9px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.ghost{background:transparent}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.wrap{max-width:1500px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:20px;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:1080px){.wrap{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.res{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;padding-right:4px}
@media (max-width:1080px){.res{position:static;max-height:none;overflow:visible}}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.sec>h2{display:flex;align-items:baseline;gap:10px;margin:0 0 12px;font-size:15px;font-weight:700}
.sec>h2 .n{font-family:var(--f-mono);font-size:11.5px;color:var(--accent);font-weight:600;background:var(--accent-soft);border-radius:5px;padding:2px 6px}
.sec>h2 .hint{margin-left:auto;font-weight:400;font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>span{font-size:12px;color:var(--muted);font-weight:500}
.f.w2{grid-column:span 2}
@media (max-width:420px){.f.w2{grid-column:span 1}}
.in{display:flex;align-items:center;background:var(--field);border:1px solid var(--line);border-radius:7px;min-width:0}
.in:focus-within{border-color:var(--accent)}
.in input,.in select{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;padding:7px 9px}
.in select{padding-right:4px;cursor:pointer}
.in i{font-style:normal;font-size:11.5px;color:var(--muted);padding-right:9px;white-space:nowrap}
.in input[data-t=n]{font-family:var(--f-mono);font-size:13px}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:grid;gap:8px;align-items:end;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px}
.row .in{background:var(--surface)}
.row.wall{grid-template-columns:minmax(140px,2fr) 76px minmax(130px,1.6fr) 76px 88px auto}
.row.win{grid-template-columns:minmax(170px,2.4fr) 76px 76px 64px auto}
.row.door{grid-template-columns:minmax(150px,2fr) minmax(120px,1.2fr) 84px 84px 64px auto}
.row.tank{grid-template-columns:minmax(150px,2fr) 100px 140px auto}
.row.rad{grid-template-columns:minmax(150px,2fr) 70px 90px 110px auto auto}
@media (max-width:640px){.row.wall,.row.win,.row.door,.row.tank,.row.rad{grid-template-columns:1fr 1fr}.row .f.wide{grid-column:1/-1}}
.meta{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);white-space:nowrap;align-self:center}
.x{border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:6px;border-radius:6px;align-self:center}
.x:hover{color:var(--bad);background:var(--bad-soft)}
.add{margin-top:8px}
.note{font-size:12px;color:var(--muted);margin:8px 0 0}
.info{font-size:12.5px;background:var(--accent-soft);border-radius:7px;padding:8px 10px;margin-top:10px;font-family:var(--f-mono)}
.hp{background:var(--field);border:1px solid var(--line);border-radius:8px;padding:12px}
.hp .in{background:var(--surface)}
.hp-h{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.hp-h .in{flex:1}
.sub{font-size:13px;font-weight:700;margin:16px 0 8px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow-x:auto}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:620px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface)}
.kpi b{display:block;font-family:var(--f-display);font-weight:600;font-size:22px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi span{font-size:11.5px;color:var(--muted)}
.kpi.main{background:var(--heat-soft);border-color:transparent}
.kpi.main b{color:var(--heat)}
.bar{height:6px;border-radius:3px;background:var(--heat);min-width:2px}
.pill{display:inline-block;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.info{background:var(--accent-soft);color:var(--accent)}
.rec{border:1.5px solid var(--accent);border-radius:var(--r);padding:14px 16px;background:var(--surface)}
.rec h3{margin:0 0 4px;font-family:var(--f-display);font-weight:600;font-size:17px}
.rec .why{margin:6px 0 0;color:var(--muted);font-size:13px}
.rec ul{margin:8px 0 0;padding-left:18px;font-size:13px}
tr.best td{background:var(--accent-soft)}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;z-index:20;max-width:calc(100% - 32px)}
textarea{width:100%;min-height:90px;font-family:var(--f-mono);font-size:12px;background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:8px}
details summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--accent)}
.lock{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px}
.lock.dim{background:rgba(10,20,40,.55)}
.lock-card{width:min(360px,100%);display:flex;flex-direction:column;gap:14px;align-items:stretch;text-align:center}
.lock-card img{width:170px;height:auto;margin:0 auto}
.lock-card h2{margin:0 0 6px;font-family:var(--f-display);font-weight:500;font-size:16px;color:#fff}
.lock-card .f>span{color:rgba(255,255,255,.85);text-align:left}
.lock-card .in{background:#fff;border-color:#fff}.lock-card .in input{color:#14223a}
.lock-card .btn.pri{background:#fff;color:#24529c;border-color:#fff;padding:11px}
.lock-card.light{background:var(--surface);border-radius:12px;padding:20px;text-align:left}
.lock-card.light .f>span{color:var(--muted)}.lock-card.light .in{background:var(--field);border-color:var(--line)}.lock-card.light .in input{color:var(--ink)}
.lock-card.light .btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.err{color:#ffd2cc;margin:0;font-size:13px;min-height:1em}.lock-card.light .err{color:var(--bad)}
@media (max-width:640px){input,select,textarea{font-size:16px!important}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head><body>

/* ===================== HISOB-KITOB ===================== */
const nz=v=>(v==null||v===""||!isFinite(+v))?0:+v;
function wallU(w){ const m=WALLMAT[w.mat]||WALLMAT.gisht_pishiq; const ins=INS[w.ins]||INS.none; let R=0.13+0.04+0.04+nz(w.th)/100/m[1]; if(ins[1]>0) R+=nz(w.insTh)/100/ins[1]; return 1/R; }
function layerR(base,ins,th){ let R=base; const I=INS[ins]||INS.none; if(I[1]>0) R+=nz(th)/100/I[1]; return R; }

function calc(){
  const r=REG[S.region]||REG.toshkent_sh;
  const Ti=nz(S.ti)||20, Te=(S.teOv===null||S.teOv===""||S.teOv==null)?r.te:+S.teOv, dT=Ti-Te;
  const L=nz(S.bld.len), W=nz(S.bld.wid), F=Math.max(1,Math.round(nz(S.bld.floors))), H=nz(S.bld.h);
  const areaOv=nz(S.bld.area)>0?nz(S.bld.area):0, perOv=nz(S.bld.perim)>0?nz(S.bld.perim):0;
  const heated=areaOv||L*W*F, foot=heated/F; const perEst=areaOv?2*(Math.sqrt(1.5*foot)+Math.sqrt(foot/1.5)):2*(L+W); const perim=perOv||perEst, wallGross=perim*H*F, vol=heated*H;
  const els=[];
  // derazalar va eshiklar
  let winA=0, doorA=0;
  S.windows.forEach((w,i)=>{ const t=WIN[w.type]||WIN.pvx1; const A=nz(w.w)*nz(w.h)*nz(w.n); winA+=A; if(A>0) els.push({g:"Derazalar",name:t[0],A,U:t[1],b:1}); w._A=A; });
  S.doors.forEach(d=>{ const t=DOOR[d.type]||DOOR.met_i; const loc=DOORLOC[d.loc]||DOORLOC.tashqi; const A=nz(d.w)*nz(d.h)*nz(d.n); doorA+=A; if(A>0) els.push({g:"Eshiklar",name:t[0]+(loc[1]<1?" (isitilmaydigan xonaga)":""),A,U:t[1],b:loc[1]}); });
  // devorlar
  const given=S.walls.reduce((s,w)=>s+(w.area!=null&&w.area!==""?nz(w.area):0),0);
  const blanks=S.walls.filter(w=>w.area==null||w.area==="").length;
  const share=blanks?Math.max(0,wallGross-given)/blanks:0;
  const gross=S.walls.map(w=>(w.area!=null&&w.area!=="")?nz(w.area):share);
  const gSum=gross.reduce((a,b)=>a+b,0); const openF=gSum>0?Math.min(0.95,(winA+doorA)/gSum):0;
  S.walls.forEach((w,i)=>{ const U=wallU(w); w._U=U; const A=gross[i]*(1-openF); w._A=A; if(A>0){ const m=WALLMAT[w.mat]; const ins=INS[w.ins]; els.push({g:"Devorlar",name:`${m[0]} ${fmt(nz(w.th))} sm`+(ins&&ins[1]>0&&nz(w.insTh)>0?` + ${ins[0].toLowerCase()} ${fmt(nz(w.insTh))} sm`:""),A,U,b:1}); } });
  // tom
  const rt=ROOFT[S.roof.type]||ROOFT.cherdak; const roofR=0.10+0.04+layerR((ROOFB[S.roof.base]||ROOFB.temirbeton)[1],S.roof.ins,S.roof.insTh); const roofU=1/roofR;
  let skyA=0; S.skylights.forEach(w=>{ const t=SKY[w.type]||SKY.mans2; const A=nz(w.w)*nz(w.h)*nz(w.n); w._A=A; skyA+=A; if(A>0) els.push({g:"Lomboz",name:t[0],A,U:t[1],b:1}); });
  const roofGross=S.roof.type==="mansard"?foot*1.15:foot; const roofA=Math.max(0,roofGross-skyA);
  if(rt[1]>0&&roofA>0) els.push({g:"Tom / shift",name:rt[0],A:roofA,U:roofU,b:rt[1]});
  // pol
  const ft=FLOORT[S.floor.type]||FLOORT.grunt; const Rf=layerR((FLOORB[S.floor.base]||FLOORB.beton)[1],S.floor.ins,S.floor.insTh); let floorU;
  if(S.floor.type==="grunt"){ const B=perim>0?foot/(0.5*perim):1, lg=2.0, wt=nz(S.walls[0]?.th)/100||0.3; const dt=wt+lg*(0.17+Rf+0.04); floorU=dt<B? 2*lg/(Math.PI*B+dt)*Math.log(Math.PI*B/dt+1) : lg/(0.457*B+dt); }
  else if(S.floor.type==="yertola") floorU=1/(0.17+Rf+0.17); else floorU=1/(0.17+Rf+0.04);
  const fb=S.floor.type==="grunt"?Math.min(1,1.45*Math.max(0,Ti-(r.ta??14))/Math.max(1,dT)):ft[1]; if(ft[1]>0) els.push({g:"Pol",name:ft[0]+(S.floor.type==="grunt"?" (ISO 13370; grunt harorati hisobga olingan)":""),A:foot,U:floorU,b:fb});
  // issiqlik ko'priklari
  const envA=els.reduce((s,e)=>s+e.A,0), dU=+S.bridge||0.05;
  els.push({g:"Issiqlik ko'priklari",name:`ΔU = ${String(dU).replace(".",",")} W/m²K × ${fmt(envA)} m²`,A:envA,U:dU,b:1,bridge:true});
  els.forEach(e=>{ e.HT=e.A*e.U*e.b; e.Q=e.HT*dT; });
  const HT=els.reduce((s,e)=>s+e.HT,0);
  const n=+S.vent.n||0.5, hr=Math.min(0.95,nz(S.vent.hr)/100);
  const HV=0.34*n*vol*0.85*(1-hr); // ichki hajm ≈ 0.85 × tashqi
  const Qtr=HT*dT, Qv=HV*dT, Qheat=Qtr+Qv, Qdes=Qheat*(1+nz(S.margin)/100);
  const dhwOn=!!S.dhw.on, persons=nz(S.dhw.persons), liters=nz(S.dhw.liters);
  const dhwAllow=dhwOn?persons*200:0, Qtot=Qdes+dhwAllow;
  const dhwYear=dhwOn? persons*liters*4.186*40/3600*365*1.1 : 0; const dhwM=MDAYS.map(d=>dhwYear*d/365);
  // bin usuli: har oy uchun soatlik harorat taqsimoti (σ = 5 K)
  const Htot=HT+HV, Tbal=Ti-3; const bins=[];
  HEAT_MI.forEach((mi,k)=>{ const Tm=r.m[k], hrs=MDAYS[mi]*24; const arr=[]; let sw=0; for(let T=Math.round(Tm-15);T<=Math.round(Tm+15);T++){ const w=Math.exp(-0.5*((T-Tm)/5)**2); arr.push([T,w]); sw+=w; } arr.forEach(([T,w])=>{ const h=hrs*w/sw; const load=Math.max(0,Htot*(Tbal-T))/1000; if(load>0) bins.push({mi,T,h,load}); }); });
  const heatM=Array(12).fill(0); bins.forEach(b=>heatM[b.mi]+=b.load*b.h);
  const heatYear=heatM.reduce((a,b)=>a+b,0);
  // radiatorlar: kerakli suv harorati EN 442: Q = Qn·(ΔT/50)^n, issiqlik nasosi rejimi ΔT suv = 5 K
  let rad=null, tfDes=(EMIT[S.emitter]||EMIT.rad)[1];
  if(S.emitter==="rad"){
    let q50=0, nw=0; S.rads.forEach(r=>{ const t=RADT[r.type]||RADT.alyumin; const per=nz(r.w)||t[1]; const cnt=nz(r.n)*(t[3]==="seksiya"?nz(r.sec):1); r._q=cnt*per; q50+=r._q; nw+=r._q*t[2]; });
    const nexp=q50>0?nw/q50:1.3; const need=Qdes;
    const outAt=sup=>q50*Math.pow(Math.max(0,(sup-2.5-Ti))/50,nexp);
    let req=q50>0?Ti+50*Math.pow(need/q50,1/nexp)+2.5:99;
    const over=req>75; const supply=Math.min(75,Math.max(35,Math.ceil(req)));
    const avgSec=(()=>{ const r=S.rads.find(r=>(RADT[r.type]||RADT.alyumin)[3]==="seksiya"); return r?(nz(r.w)||(RADT[r.type]||RADT.alyumin)[1]):170; })();
    const add55=Math.max(0,Math.ceil((need/Math.pow((55-2.5-Ti)/50,nexp)-q50)/avgSec)), add45=Math.max(0,Math.ceil((need/Math.pow((45-2.5-Ti)/50,nexp)-q50)/avgSec));
    rad={q50,nexp,need,req,supply,over,rel:sup=>Math.pow(Math.max(0,sup-2.5-Ti)/50,nexp),out45:outAt(45),out55:outAt(55),out65:outAt(65),add55,add45,avgSec};
    tfDes=q50>0?supply:55;
  }
  const tfMan=nz(S.tfMan)>0?Math.min(80,Math.max(25,nz(S.tfMan))):null; if(tfMan) tfDes=tfMan;
  const tfAt=T=>Math.min(tfDes,Math.max(28,25+(tfDes-25)*(Ti-T)/Math.max(1,dT)));
  const designLoad=T=>(Htot*(1+nz(S.margin)/100)*Math.max(0,Ti-T)+dhwAllow)/1000;
  const ctx={r,Ti,Te,dT,tfDes,tfAt,designLoad,bins,heatM,heatYear,dhwM,dhwYear,Qtot,radRel:rad&&rad.q50>0?rad.rel:null};
  const pumps=S.pumps.map((hp,i)=>evalHP(hp,i,ctx));
  if(!pumps.some(p=>p.cls<=1)){ S.pumps.forEach((hp,i)=>{ if(!(nz(hp.p7)>0)) return; for(let n=2;n<=4;n++){ const h2={...hp,name:`${n} × ${hp.name||"Nasos "+(i+1)} (kaskad)`,p7:nz(hp.p7)*n,pm7:nz(hp.pm7)?nz(hp.pm7)*n:null,price:nz(hp.price)*n+nz(S.install)*(n-1)}; const e=evalHP(h2,"k"+i+"_"+n,ctx); if(e.cls===0){ e.cascade=n; pumps.push(e); break; } if(e.cls===2||e.cls===4) break; } }); }
  // tavsiya
  const life=p=>p.capex+10*p.cost;
  const pick=cls=>pumps.filter(p=>p.cls===cls).sort((a,b)=>life(a)-life(b))[0];
  let rec=pick(0)||pick(1)||pumps.filter(p=>p.cls===2).sort((a,b)=>a.p7-b.p7)[0]||null;
  pumps.sort((a,b)=>a.cls-b.cls||life(a)-life(b));
  // buffer
  let buf=null;
  if(rec){ const perKw=rec.inv?10:20; const f=S.emitter==="pol"?0.7:1; let V=Math.max(30,Math.ceil(rec.p7*perKw*f/10)*10);
    const tanks=S.tanks.map((t,i)=>({...t,i,vol:nz(t.vol),price:nz(t.price)})).filter(t=>t.vol>0).sort((a,b)=>a.vol-b.vol);
    const ok=tanks.find(t=>t.vol>=V); const tank=ok||tanks[tanks.length-1]||null;
    buf={V,perKw,tank,enough:!!ok,big:tank&&tank.vol>V*3}; }
  const cmpHP= S.compare==="auto"? rec : (pumps.find(p=>String(p.i)===String(S.compare))||rec);
  const fuel=fuelCompare(ctx,cmpHP,buf);
  return {tfMan,rad,skyA,roofA,areaOv,perOv,r,Ti,Te,dT,L,W,F,H,foot,heated,perim,wallGross,vol,winA,doorA,els,HT,HV,Qtr,Qv,Qheat,Qdes,Qtot,dhwAllow,dhwYear,heatM,heatYear,tfDes,pumps,rec,buf,fuel,cmpHP,roofU,floorU,n,openF};
}

function evalHP(hp,i,c){
  const isAir=hp.kind==="havo"; const p7=nz(hp.p7), c7=nz(hp.cop7)||3;
  const pm7=isAir?(nz(hp.pm7)||p7*(hp.inv?0.85:0.7)):p7, cm7=isAir?(nz(hp.copm7)||c7*0.62):c7;
  const tmin=isAir?((hp.tmin==null||hp.tmin==="")?-20:+hp.tmin):-99, tmax=nz(hp.tmax)||55;
  const sP=(p7-pm7)/14, sC=(c7-cm7)/14;
  const cap=(T,tf)=>{ if(T<tmin) return 0; let P=isAir?(T>=-7?pm7+sP*(T+7):pm7-0.5*sP*(-7-T)):p7; P=Math.max(0.35*p7,Math.min(1.25*p7,P)); return P*(1-0.008*(tf-35)); };
  const cop=(T,tf)=>{ let C=isAir?(T>=-7?cm7+sC*(T+7):cm7-0.5*sC*(-7-T)):c7; C=Math.min(c7*1.45,C); C*=Math.min(1.15,1-0.025*(tf-35)); return Math.max(1.2,C); };
  const flowOk=tmax>=35; const tfLim=T=>Math.min(c.tfAt(T),tmax); const radF=T=>{ const nd=c.tfAt(T); if(nd<=tmax) return 1; if(!c.radRel) return Math.max(0,1-0.03*(nd-tmax)); return Math.min(1,c.radRel(tmax)/Math.max(1e-6,c.radRel(nd))); };
  const Pdes=cap(c.Te,tfLim(c.Te)); const cov=c.Qtot>0?Pdes*1000/c.Qtot:0;
  let biv=null; for(let T=20;T>=c.Te-0.01;T-=0.5){ if(cap(T,tfLim(T))<c.designLoad(T)){ biv=T; break; } }
  const elM=Array(12).fill(0), hpM=Array(12).fill(0), bkM=Array(12).fill(0);
  c.bins.forEach(b=>{ const tf=tfLim(b.T); const P=flowOk?cap(b.T,tf):0; const radLim=b.load*radF(b.T); const out=Math.min(b.load,P,radLim); const bk=b.load-out; hpM[b.mi]+=out*b.h; bkM[b.mi]+=bk*b.h; elM[b.mi]+=(out>0?out/cop(b.T,tf):0)*b.h+bk*b.h; });
  const copD=flowOk?cop(12,Math.min(tmax,52)):1; c.dhwM.forEach((q,mi)=>{ elM[mi]+=q/copD; });
  const hpHeat=hpM.reduce((a,b)=>a+b,0), bkHeat=bkM.reduce((a,b)=>a+b,0), el=elM.reduce((a,b)=>a+b,0);
  const share=c.heatYear>0?hpHeat/c.heatYear:0; const scop=el>0?(c.heatYear+c.dhwYear)/el:0;
  const cost=elecIncr(elM); const backupKw=Math.max(0,c.Qtot/1000-Pdes);
  let cls,verdict;
  if(!flowOk){cls=4;verdict="Mos emas: suv harorati juda past";}
  else if(p7<=0){cls=4;verdict="Ma'lumot to'liq emas";}
  else if(cov>1.6){cls=2;verdict="Ortiqcha katta";}
  else if(cov>=0.9){cls=0;verdict="Mos keladi";}
  else if(cov>=0.7&&share>=0.9){cls=1;verdict="Zaxira qizdirgich bilan mos";}
  else {cls=3;verdict="Quvvati yetmaydi";}
  if(flowOk&&c.tfDes>tmax&&cls<=1) verdict+=` (suv maks. ${tmax}°C)`;
  return {i,name:hp.name||`Nasos ${i+1}`,kind:hp.kind,p7,c7,pm7,cm7,tmin,tmax,inv:!!hp.inv,price:nz(hp.price),capex:nz(hp.price)+nz(S.install),Pdes,cov,biv,share,scop,el,elM,hpM,bkM,bkHeat,cost,backupKw,cls,verdict,flowOk,copD,copDes:cop(c.Te,tfLim(c.Te))};
}
function tierCost(x,tiers){ let c=0,prev=0; for(const [lim,p] of tiers){ const Lm=(lim==null||lim==="")?Infinity:+lim; if(x>prev) c+=(Math.min(x,Lm)-prev)*nz(p); prev=Lm; if(x<=Lm) break; } return c; }
function elecBill(k){ return tierCost(k,S.tar.elec); }
function elecIncr(arr){ const b=nz(S.tar.baseElec); return arr.reduce((s,k,mi)=>s+elecBill(b+k)-elecBill(b),0); }
function gasBill(v,mi){ const T=S.tar; const norm=GAS_WINTER.includes(mi)?nz(T.gasNormW):nz(T.gasNormO); let c=Math.min(v,norm)*nz(T.gasNormP); if(v>norm) c+=tierCost(v,[[norm,0],...T.gasTiers]); return c; }
function fuelCompare(c,hp,buf){
  const T=S.tar; const qM=c.heatM.map((h,mi)=>h+c.dhwM[mi]); const Q=qM.reduce((a,b)=>a+b,0);
  const gasM=qM.map(q=>q/(nz(T.gasKwh)*nz(T.effGas)/100||1)); const gasV=gasM.reduce((a,b)=>a+b,0);
  const gasCost=gasM.reduce((s,v,mi)=>s+gasBill(nz(T.baseGas)+v,mi)-gasBill(nz(T.baseGas),mi),0);
  const elM=qM.map(q=>q/(nz(T.effEl)/100||1)); const elK=elM.reduce((a,b)=>a+b,0); const elCost=elecIncr(elM);
  const coalKg=Q/(nz(T.coalKwh)*nz(T.effCoal)/100||1); const coalCost=coalKg/1000*nz(T.coalPrice);
  const rows=[
    {k:"gas",name:"Gaz qozon",qty:`${fmt(gasV)} m³`,cost:gasCost,capex:nz(T.pGas),eff:`FIK ${fmt(nz(T.effGas))}%`},
    {k:"coal",name:"Ko'mir qozon",qty:`${fmt(coalKg/1000,1)} t`,cost:coalCost,capex:nz(T.pCoal),eff:`FIK ${fmt(nz(T.effCoal))}%`},
    {k:"el",name:"Elektr qozon",qty:`${fmt(elK)} kVt·s`,cost:elCost,capex:nz(T.pEl),eff:`FIK ${fmt(nz(T.effEl))}%`},
  ];
  if(hp){ rows.unshift({k:"hp",name:"Issiqlik nasosi",sub:hp.name,qty:`${fmt(hp.el)} kVt·s`,cost:hp.cost,capex:hp.capex+(buf&&buf.tank?buf.tank.price:0),eff:`SCOP ${fmt(hp.scop,2)}`}); }
  rows.forEach(r=>{ r.perKwh=Q>0?r.cost/Q:0; r.ten=r.capex+10*r.cost; });
  const h=rows.find(r=>r.k==="hp"); if(h) rows.forEach(r=>{ if(r.k!=="hp"){ const sav=r.cost-h.cost, extra=h.capex-r.capex; r.payback= sav>0? Math.max(0,extra/sav):null; r.save=sav; } });
  return {rows,Q,gasV,elK,coalKg};
}

  const fname=("Issiqlik_hisobi_"+(S.client.name||"mijoz")).replace(/[ʻʼ‘’']/g,"").replace(/[^\w\-]+/g,"_").slice(0,80)+".pdf";
  const cap=window.Capacitor;
  if(cap&&cap.isNativePlatform&&cap.isNativePlatform()){
    try{
      const FS=(cap.Plugins&&cap.Plugins.Filesystem)||cap.registerPlugin("Filesystem"), SH=(cap.Plugins&&cap.Plugins.Share)||cap.registerPlugin("Share");
      const b64=doc.output("datauristring").split(",")[1];
      const res=await FS.writeFile({path:fname,data:b64,directory:"CACHE"});
      await SH.share({title:fname,files:[res.uri],dialogTitle:"PDF hisobotni saqlash yoki yuborish"});
    }catch(err){ if(!/cancel/i.test(String(err&&err.message))) toast("PDF saqlanmadi: "+(err&&err.message||err)); }
    return;
  }
  const isMob=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  if(isMob&&navigator.canShare){ try{ const f=new File([doc.output("blob")],fname,{type:"application/pdf"}); if(navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:fname}); return; } }catch(err){ if(err&&err.name==="AbortError") return; } }
  try{
    const url=URL.createObjectURL(new Blob([doc.output("arraybuffer")],{type:"application/pdf"}));
    const a=document.createElement("a"); a.href=url; a.download=fname; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000); toast("PDF tayyor: "+fname);
  }catch(err){ toast("PDF saqlanmadi: "+err.message); }
}

function sha256(str){ // kichik, mustaqil SHA-256 (oflayn ishlashi uchun)
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const b=new TextEncoder().encode(str); const l=b.length; const n=((l+9+63)>>6)<<6; const m=new Uint8Array(n); m.set(b); m[l]=0x80;
  const dv=new DataView(m.buffer); dv.setUint32(n-4,(l*8)>>>0); dv.setUint32(n-8,Math.floor(l/0x20000000));
  let h=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]; const w=new Uint32Array(64); const r=(x,k)=>(x>>>k)|(x<<(32-k));
  for(let o=0;o<n;o+=64){ for(let i=0;i<16;i++) w[i]=dv.getUint32(o+i*4); for(let i=16;i<64;i++){ const s0=r(w[i-15],7)^r(w[i-15],18)^(w[i-15]>>>3), s1=r(w[i-2],17)^r(w[i-2],19)^(w[i-2]>>>10); w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0; }
    let [a,bb,c,d,e,f,g,hh]=h; for(let i=0;i<64;i++){ const t1=(hh+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[i]+w[i])>>>0, t2=((r(a,2)^r(a,13)^r(a,22))+((a&bb)^(a&c)^(bb&c)))>>>0; hh=g; g=f; f=e; e=(d+t1)>>>0; d=c; c=bb; bb=a; a=(t1+t2)>>>0; }
    h=h.map((x,i)=>(x+[a,bb,c,d,e,f,g,hh][i])>>>0); }
  return h.map(x=>x.toString(16).padStart(8,"0")).join("");
}
